[Pricing.Strategy]
; Defines how the system calculates stakes. 
; Modes: FIXED (uses BaseStake), PROFIT_TARGET (uses TargetProfit and odds)
Mode=PROFIT_TARGET

; The exact fixed stake to place if Mode=FIXED (Value in your local currency)
BaseStake=0

; The amount of gross profit the system attempts to achieve if Mode=PROFIT_TARGET
TargetProfit=30

; The absolute minimum profit allowable if resolution strategies degrade the target
MinimumAcceptableProfit=0

; How the engine resolves conflicts (e.g., Balance too low for TargetProfit)
; Options: CLAMP_THEN_REDUCE_PROFIT, ABORT
ResolutionStrategy=CLAMP_THEN_REDUCE_PROFIT

[Pricing.Behavior]
; The discrete monetary step allowed by the platform (e.g. 10 or 1.00). 
; Prevents the math engine from generating decimal stakes if the platform requires whole numbers.
PlatformIncrement=1

; How the engine selects a specific stake from the mathematically valid Feasible Set.
; Options: MINIMUM_VALID_STAKE, MAXIMUM_VALID_STAKE, ROUND_NUMBERS
SelectionPreference=ROUND_NUMBERS

; If the user manually overrides the stake before pressing 'b', this flag dictates Rebet behavior.
; TRUE: Places the user's stake for Cycle 1, but restores the policy math for subsequent Rebets.
; FALSE: Discards the policy math and continues using the user's manual stake for all Rebets.
RestorePolicyOnRebet=true

[Rebet.Strategy]
; The maximum number of times the SequenceOrchestrator will attempt a Rebet loop.
MaxRebetAttempts=3


[Execution.Timeouts]
; Maximum wait time for DOM mutations indicating a placed bet (SUCCESS/FAIL icons). 
; If this expires, the bet resolves as strictly UNCERTAIN (never FAILED).
ResultTimeoutMs=30000

; Maximum wait time for standard page navigations and DOMContentLoaded events
NavigationTimeoutMs=10000

; Maximum wait time for session/login states to resolve
LoginTimeoutMs=15000

; Maximum time a Decision Snapshot remains valid before the Execution Plane rejects it as stale.
DecisionFreshnessTTLMs=3000

; Maximum time the Execution Plane will wait during Reconciliation before flagging an UNCERTAIN bet for manual intervention.
ReconciliationTimeoutMs=120000


[Execution.Pacing]
; Fixed interaction delay (MACRO_DELAY) between virtual keyboard clicks.
; Strictly required to be 250ms to prevent Vue.js from dropping state updates.
KeyboardTypingDelayMs=250


[Execution.Retries]
; Absolute maximum number of retries the ActionSimulator will attempt before escalating.
MaxExecutionRetries=3

; Maximum attempts the RecoveryManager will make to salvage a crashed frame.
MaxRecoveryAttempts=3

; Base exponential backoff delay for the RecoveryManager.
RecoveryBaseDelayMs=2000


[Execution.Limits]
; Maximum number of actions the ActionDispatcher will buffer in its telemetry queue.
MaxRecordedActions=1000


[RiskManagement.Policy]
; Set to true to automatically accept minor price changes (e.g. from 1.25 to 1.24)
AutoAcceptOddsChanges=false

; Hard stop limit to prevent runaway sequences. 
; Engine will abort the workflow if calculated stake exceeds this value.
MaxStake=10000

; Minimum allowable stake. If the calculated stake falls below this (e.g. due to low balance), the workflow aborts.
MinimumStake=10

; If the market suspends (odds disappear entirely), immediately abort the workflow.
AbortOnMarketSuspend=true
